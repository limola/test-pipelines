events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting - removed restrictive langgraph rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Increased rate limit for langgraph or removed entirely per user request
    limit_req_zone $binary_remote_addr zone=langgraph:10m rate=50r/s;

    # Upstream definitions
    upstream api_backend {
        server generatore-api-service:8888;
        keepalive 32;
    }

    #upstream langgraph_backend {
    #    server langgraph-api:8000;
    #    keepalive 32;
    #}

    # WebSocket connection upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name cp-be-api.int-dev.goproject.it;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;



        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }


        # Regular API routes - no auth required
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # LangGraph routes - AUTH REQUIRED with WebSocket support
        #location /langgraph/ {
        #    # Relaxed rate limiting per user request
        #    limit_req zone=langgraph burst=100 nodelay;
            
            # Internal auth subrequest to your FastAPI
        #    auth_request /auth;
        #    
            # Pass user info from auth response
        #    auth_request_set $user $upstream_http_x_user;
        #    auth_request_set $user_id $upstream_http_x_user_id;
        #    
            # Forward to LangGraph with user context (handles all requests including OPTIONS)
        #    proxy_pass http://langgraph_backend/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #    proxy_set_header X-User $user;
        #    proxy_set_header X-User-ID $user_id;
            
            # Connection reuse
        #    proxy_http_version 1.1;
        #    proxy_set_header Connection $connection_upgrade;
            
            # Handle WebSocket upgrades for streaming
        #    proxy_set_header Upgrade $http_upgrade;
        #    proxy_set_header Connection $connection_upgrade;

            # Backend handles CORS including OPTIONS requests
        #}

        # Internal auth endpoint
        location = /auth {
            internal;
            proxy_pass http://api_backend/api/v1/auth/internal/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
        }


        # Frontend static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Frontend SPA routing - catch all other requests
        # This MUST be last to avoid interfering with API routes
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Security headers for HTML pages
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }
}